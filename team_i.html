        function PlayerOperationProcessing() {
            if (SceneFrieze == false) {
                //ジャンプの仮反映
                if (stage % STAGE_MAX != STAGE_SPASE) {
                    if (key[32] == 1 && jumpCoolTime == 0 || key[32] == 1 && stage % STAGE_MAX == STAGE_SEA) {
                        key[32]++;
                        playSE(1);
                        playerSpeedY -= JUMP_POWER;
                        jumpCoolTime = 10;
                        if (stage % STAGE_MAX == STAGE_SEA) playerSpeedY += JUMP_POWER / 2;
                    }
                    playerSpeedY += GRAVITY;
                }





                if (jumpCoolTime != 0) --jumpCoolTime;



                //スクロール移動の仮反映



                if (stage % STAGE_MAX == STAGE_SEA) playerSpeedY -= buoyancy;
                //if (stage % STAGE_MAX != STAGE_SPASE) 
                if (playerX < scrollX + 200) playerSpeedX = scrollSpeed + 1;//復帰速度
                else playerSpeedX = scrollSpeed;

                if (stage % STAGE_MAX == STAGE_DESERT && bossTimeFrag == true) {
                    playerSpeedX = scrollSpeed + 1.5;
                }



                if (stage % STAGE_MAX == STAGE_SPASE) {
                    playerSpaceSpeedX = 0;
                    playerSpaceSpeedY = 0;
                    if (key[37] > 0 && bossTimeFrag == false) {
                        playerSpaceSpeedX = -playerSpaceSpeedBaseX;
                    }
                    if (key[38] > 0) {
                        playerSpaceSpeedY = -playerSpaceSpeedBaseY;
                    }
                    if (key[39] > 0 && bossTimeFrag == false) {
                        playerSpaceSpeedX = playerSpaceSpeedBaseX;
                    }
                    if (key[40] > 0) {
                        playerSpaceSpeedY = playerSpaceSpeedBaseY;
                    }

                    if (playerX > scrollX + 200 && bossTimeFrag == true) {
                        //playerX -= playerSpaceSpeedX;
                        playerSpaceSpeedX = -playerSpaceSpeedBaseX;
                    }
                    if (playerX > scrollX + 450) {
                        playerX = scrollX + 450;
                    }

                    playerSpeedX += playerSpaceSpeedX;
                    playerSpeedY += playerSpaceSpeedY;

                }


                //天井衝突エラーの回避
                if (playerY < SIZE * 1 && stage % STAGE_MAX != STAGE_SEA && stage % STAGE_MAX != STAGE_SPASE) playerSpeedY += GRAVITY * 50;

                //異常な加速によるエラーの防止
                if (playerSpeedY > SIZE) playerSpeedY = SIZE - 10;
                if (playerSpeedY < -SIZE) playerSpeedY = -SIZE + 1;

                //衝突判定(player to block)
                Collision();

                //移動の本反映
                playerY += playerSpeedY;
                playerX += playerSpeedX;

                if (playerSpeedX != 0) playerSpeedX -= playerSpaceSpeedX;
                if (playerSpeedY != 0) playerSpeedY -= playerSpaceSpeedY;


            }
        }

        }

        function BlockCollision() {
            let playerMapPositionLeft = int((playerX + 1) / SIZE);
            let playerMapPositionCenter = int((playerX + SIZE + 0) / SIZE);
            let playerMapPositionRight = int((playerX + PLAYER_SIZEX - 1) / SIZE);
            let playerMapPositionUp = int((playerY + 1) / SIZE);
            let playerMapPositionDown = int((playerY + PLAYER_SIZEY - 1) / SIZE);

            let playerMapPositionLeftAfter = int((playerX + 1 + playerSpeedX) / SIZE);
            let playerMapPositionCenterAfter = int((playerX + SIZE + 0 + playerSpeedX) / SIZE);
            let playerMapPositionRightAfter = int((playerX + PLAYER_SIZEX - 1 + playerSpeedX) / SIZE);
            let playerMapPositionUpAfter = int((playerY + 1 + playerSpeedY) / SIZE);
            let playerMapPositionDownAfter = int((playerY + PLAYER_SIZEY - 1 + playerSpeedY) / SIZE);

            //上
            if (
                map[playerMapPositionUpAfter][playerMapPositionLeft] != 0
                || map[playerMapPositionUpAfter][playerMapPositionCenter] != 0
                //|| map[playerMapPositionUpAfter][playerMapPositionCenter + 1] != 0
                //|| map[playerMapPositionUpAfter][playerMapPositionCenter + 2] != 0
                || map[playerMapPositionUpAfter][playerMapPositionRight] != 0
            ) {
                if (playerSpeedY < 0) {
                    playerSpeedY = 0;
                    playerY = playerMapPositionDownAfter * SIZE;
                }
            }

            //下
            if (
                map[playerMapPositionDownAfter][playerMapPositionLeft] != 0
                || map[playerMapPositionDownAfter][playerMapPositionCenter] != 0
                //|| map[playerMapPositionDownAfter][playerMapPositionCenter + 1] != 0
                //|| map[playerMapPositionDownAfter][playerMapPositionCenter + 2] != 0
                || map[playerMapPositionDownAfter][playerMapPositionRight] != 0
            ) {
                if (playerSpeedY > 0) {
                    playerSpeedY = 0;
                    playerY = playerMapPositionUpAfter * SIZE;

                }
            }

            //左
            if (
                map[playerMapPositionUp][playerMapPositionLeftAfter] != 0
                //|| map[playerMapPositionUp+1][playerMapPositionLeftAfter] != 0
                || map[playerMapPositionDown][playerMapPositionLeftAfter] != 0
            ) {
                if (playerSpeedX < 0) {
                    playerSpeedX = 0;
                    playerX = playerMapPositionRightAfter * SIZE;
                }
            }

            //右
            if (
                map[playerMapPositionUp][playerMapPositionRightAfter] != 0
                //|| map[playerMapPositionUp+1][playerMapPositionRightAfter] != 0
                || map[playerMapPositionDown][playerMapPositionRightAfter] != 0
            ) {
                if (playerSpeedX > 0) {
                    playerSpeedX = 0;
                    playerX = playerMapPositionLeftAfter * SIZE;
                }
            }
        }

        function ScrollOperationProcessing() {
            if (SceneFrieze == false) {
                if (playerX > 200 && scrollX < mapMaxX * SIZE - 1000) scrollX += scrollSpeed;

                //console.log(scrollX, mapMaxX * SIZE - 2000);



                if (playerY < mapMaxY * SIZE - 360 && playerY > 360) scrollY = playerY - 360;
                if (playerY > mapMaxY * SIZE - 360) scrollY = mapMaxY * SIZE - 720;
            }

            if (SceneFrieze == false) {

        //------------------------------------------------------------------------------------

        function ScoreDrawingProcessing() {
            setAlp(50);
            fRect(30, 64, 240, 80, "blue");
            setAlp(100);
            if (score < 10) fText("SCORE:0000" + score, 150, 100, 36, "white");
            else if (score < 100) fText("SCORE:000" + score, 150, 100, 36, "white");
            else if (score < 1000) fText("SCORE:00" + score, 150, 100, 36, "white");
            else if (score < 10000) fText("SCORE:0" + score, 150, 100, 36, "white");
            else if (score < 100000) fText("SCORE:" + score, 150, 100, 36, "white");
        }

        function Animationprocessing() {
            KillBossAnimation()

            StageChangeSceneAnimation();

            AppearanceAnimation();
        }

        function KillBossAnimation() {
            if (killBoss == true) {
                if (entityType[bossNum] == BOSS_CYBER2) {
                    entityX[bossNum] += 50;
                    if (entityX[bossNum] > scrollX + 1000) {
                        entityF[bossNum] = false;
                        SceneFrieze = true;
                        stageInOut = 1;
                        killBoss = false;
                        stageChangeScene = true;
                    }
                } else {
                    entityY[bossNum] += 30;
                    if (entityY[bossNum] > 3000) {
                        entityF[bossNum] = false;
                        SceneFrieze = true;
                        stageInOut = 1;
                        killBoss = false;
                        stageChangeScene = true;
                    }
                }

            }
        }


        let stageChangescreen = -1;
        function StageChangeSceneAnimation() {
            if (firstFlag == true) {
                fRect(0, 0, 1080, 720, "white");
                drawImgS(titleImg[2], 0, 0, 1080, 720);
            }
            if (stageChangeScene == true) {
                if (stageInOut == 0) {
                    if (stageChangescreen == -1) {
                        stageChangescreen = 1080;
                    } else {
                        fRect(0, 0, stageChangescreen, 720, "red");
                        stageChangescreen -= 80;
                        if (stageChangescreen < 0) {
                            stageChangescreen = -1;
                            stageChangeScene = false;
                            SceneFrieze = false;
                            stopBgm();
                        }
                    }


                } else if (stageInOut == 1) {
                    if (stageChangescreen == -1) {
                        stageChangescreen = 0;
                    } else {
                        fRect(0, 0, stageChangescreen, 720, "red");
                        stageChangescreen += 80;
                        SceneFrieze = true;
                        if (stageChangescreen > 1200) {
                            stageChangescreen = -1;
                            stageChangeScene = true;
                            SceneFrieze = false;
                            stageInOut = 0;
                            if (firstFlag == false) stagechange = true;
                            else firstFlag = false;
                            if (endFlag == true) idx = RESULT;
                        }
                    }
                }
            }
        }

        let AppearanceFlag = false;
        function AppearanceAnimation() {
            if (AppearanceFlag == true) {
                if (entityType[bossNum] == BOSS_DESERT) {
                    SceneFrieze = true;
                    entityY[bossNum] -= 5;
                    if (mapMaxY / 2 * SIZE + SIZE * 3 > entityY[bossNum]) {
                        AppearanceFlag = false;
                        bossTimeFrag = true;
                        SceneFrieze = false;
                    }
                }
                if (entityType[bossNum] == BOSS_CYBER2) {
                    SceneFrieze = true;
                    entityX[bossNum] += 80;
                    if (scrollX + 300 < entityX[bossNum]) {
                        AppearanceFlag = false;
                        bossTimeFrag = true;
                        SceneFrieze = false;
                    }
                }
                if (entityType[bossNum] == BOSS_WESTUN) {
                    SceneFrieze = true;
                    if (mapMaxY * SIZE - (5) * SIZE < entityY[bossNum]) entityY[bossNum] -= 40;
                    else entityX[bossNum] += 80;
                    if (scrollX + 800 < entityX[bossNum]) {
                        AppearanceFlag = false;
                        bossTimeFrag = true;
                        SceneFrieze = false;
                    }
                }

                if (entityType[bossNum] == BOSS_LAST) {
                    SceneFrieze = true;
                    entityY[bossNum] += 80;
                    entityX[bossNum] -= 40;
                    //console.log(entityX[bossNum])
                    //console.log(entityY[bossNum])
                    if (400 < entityY[bossNum]) {
                        AppearanceFlag = false;
                        bossTimeFrag = true;
                        SceneFrieze = false;
                    }
                }

        }



        function initEffect() {
            for (let i = 0; i < EFFECT_MAX; i++) {
                effectN[i] = 0;
                effectType[i] = 0;
            }
            effectNumber = 0;
        }

        function setEffect(x, y, n, type) {
            effectX[effectNumber] = x;
            effectY[effectNumber] = y;
            effectN[effectNumber] = n;
            effectType[effectNumber] = type;
            effectNumber = (effectNumber + 1) % EFFECT_MAX;
        }

        function drawEffect() {
            for (let i = 0; i < EFFECT_MAX; i++) {
                if (effectN[i] > 0) {

                    drawImgTS(effectImg[effectType[i]], (effectN[i]) * 64, 0, 64, 64, effectX[i] - scrollX - 100, effectY[i] - scrollY - 100, 256, 256);

                    effectN[i]--;
                }
            }
        }
